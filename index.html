<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Offline-Lernkarten mit Spaced Repetition" />
    <meta name="theme-color" content="#8a4b12" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <title>Lernkarten</title>
    <script>
      // Farbschema und Zugmodus vor dem ersten Zeichnen setzen, sonst springt die Seite sichtbar um.
      try {
        var stored = JSON.parse(localStorage.getItem('lernkarten-settings') || '{}');
        if (stored.theme === 'dark' || stored.theme === 'light')
          document.documentElement.dataset.theme = stored.theme;
        if (stored.trainMode === true) document.documentElement.classList.add('train');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
